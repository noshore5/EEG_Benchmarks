version: 0.1.0
date_released: "2026-09-06"
abstract: >
  A reconstruction of the TMC-T architecture (Godoy et al., "EEG-Based
  Epileptic Seizure Prediction Using Temporal Multi-Channel Transformers",
  arXiv:2209.11172) trained here for seizure DETECTION rather than
  prediction. A three-block 1D conv tokenizer over the double-banana
  bipolar montage feeds a single-layer Transformer encoder (d_model 32,
  8 heads); mean-pooled tokens go to a small MLP head. Inference slides a
  4 s window (1 s stride) over the recording, thresholds the per-window
  seizure probability, then merges detections within 30 s and drops
  events shorter than 10 s.
