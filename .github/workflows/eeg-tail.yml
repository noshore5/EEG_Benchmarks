name: eeg-tail (read-only status/log check on an eeg-run box)

# Lets a Claude session with NO AWS creds "tail" a running eeg-run box:
# dumps the current S3 run.log for the given run name plus the launched
# instance's state, into this job's log, which is readable via the
# GitHub API/MCP tools. Re-trigger to get a fresh snapshot (poll, don't
# hold the job open).
#
# Read-only: same OIDC role as eeg-run.yml (eeg-gh-launcher), scoped by
# scripts/setup_gh_launcher_tail.sh to s3:GetObject/ListBucket on
# exports/* only, plus the Describe* it already has. No write, no
# terminate here -- see eeg-terminate.yml for that.

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: "Run name / S3 prefix under exports/runs/<name>/, e.g. smoke-launcher-verify"
        required: true
        type: string
      instance_id:
        description: "Optional: instance ID to also check state/orphan status for"
        required: false
        default: ""
        type: string
      skip_results_dump:
        description: "Skip the results/ CSV recovery dump (set true when you just need run.log/boot.log -- the CSV dump can be 100KB+ and the GitHub Actions log API/MCP get_job_logs truncates from the FRONT when the total log is large, silently dropping the earlier run.log/boot.log sections)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::827938107865:role/eeg-gh-launcher
          aws-region: us-east-1

      - name: Snapshot
        env:
          RUN_NAME: ${{ inputs.run_name }}
          IID: ${{ inputs.instance_id }}
          SKIP_RESULTS_DUMP: ${{ inputs.skip_results_dump }}
        run: |
          set -uo pipefail
          BUCKET=noshore-eeg-benchmarks-827938107865
          PFX="s3://$BUCKET/exports/runs/$RUN_NAME"
          echo "== run.log ($PFX/run.log) =="
          aws s3 cp "$PFX/run.log" - 2>&1 || echo "(not present yet)"
          echo
          echo "== eeg-job.log tail, if shipped =="
          aws s3 cp "$PFX/eeg-job.log" - 2>&1 | tail -n 80 || echo "(not present)"
          echo
          # promote_results.sh's own stdout (deploy-key read, git push, rebase
          # conflicts) never lands in run.log -- that only captures the
          # training script's stdout/stderr. It's part of the whole user-data
          # script's own log (boot.log), captured by the top-level `exec >
          # /var/log/eeg-run-spot.log` in eeg-run-spot.sh. Tail is enough:
          # the promote step is always the last thing before self-terminate.
          # See FAILURE_LOG.md #13 for the auto-push gap this was added to catch.
          echo "== boot.log tail (promote_results.sh output), if shipped =="
          aws s3 cp "$PFX/boot.log" - 2>&1 | tail -n 60 || echo "(not present)"
          echo
          # eeg-run-spot.sh's finish() ships /root/repo/Epilepsy/results to
          # exports/runs/<name>/results/ regardless of whether promote_results.sh's
          # git push succeeded -- this is the recovery path when auto-push fails
          # (checkpoints/* is deliberately NOT readable by this role, see
          # setup_gh_launcher_tail.sh, but this exports/ copy is). Dump every CSV
          # found so a failed-push run's results can still be recovered and
          # committed manually without needing real AWS creds.
          if [ "$SKIP_RESULTS_DUMP" = "true" ]; then
            echo "== results/ CSVs: skipped (skip_results_dump=true) =="
          else
            echo "== results/ CSVs (exports/runs/<name>/results/), for manual recovery if auto-push failed =="
            for key in $(aws s3 ls --recursive "$PFX/results/" 2>/dev/null | awk '{print $4}'); do
              echo "--- s3://$BUCKET/$key ---"
              aws s3 cp "s3://$BUCKET/$key" - 2>&1
              echo
            done
          fi
          echo
          if [ -n "$IID" ]; then
            echo "== instance state ($IID) =="
            aws ec2 describe-instances --instance-ids "$IID" \
              --query 'Reservations[].Instances[].[InstanceId,State.Name,LaunchTime]' --output text \
              || echo "(describe failed)"
          fi
          echo
          echo "== any running Project=eeg boxes (orphan check) =="
          aws ec2 describe-instances \
            --filters Name=tag:Project,Values=eeg Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].[InstanceId,InstanceType,LaunchTime]' --output text
