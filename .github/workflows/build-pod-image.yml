name: Build and push RunPod pod image

# Builds the root Dockerfile (system/Python deps for the Epilepsy pipelines,
# no repo code baked in -- see the Dockerfile's own comments) and pushes it
# to GHCR. Runs on a real GitHub-hosted Docker daemon, not on a RunPod pod --
# RunPod pods can't run Docker themselves (unprivileged containers, no
# cap_sys_admin), and RunPod's own GitHub-integration Serverless build was
# tried first and found to be a dead end for this: it publishes to RunPod's
# internal registry.runpod.net, scoped to the Serverless endpoint it built
# for, which a plain Pod can't pull ("Failed to get Hub registry auth" /
# "No such image" -- confirmed against a live Pod, not a guess). GHCR is a
# real registry a Pod's imageName can pull from directly.
#
# Only triggers on changes to the things that actually affect the image
# (Dockerfile, requirements.txt, this workflow) -- not on every commit to
# the branch, since repo code is intentionally not baked in (see
# Dockerfile). Rebuild manually via workflow_dispatch if needed for any
# other reason.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/build-pod-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Date + short commit hash tag, per this repo's own convention for
      # distinguishing old/new builds (see README.md's "RunPod pod image"
      # section) -- plus a floating `latest` tag for convenience.
      - name: Compute image tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/noshore5/eeg_benchmarks:${{ steps.tag.outputs.tag }}
            ghcr.io/noshore5/eeg_benchmarks:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
